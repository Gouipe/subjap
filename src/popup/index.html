<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SubJap</title>
    <style>
      /* The popup window takes its height from the document: a 100 % minimum
         would pin it at its tallest and keep it from shrinking. The shared
         theme stylesheet is linked after this block, hence the stronger
         selectors. */
      :root,
      :root body,
      :root #root {
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
